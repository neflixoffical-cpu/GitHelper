<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" role="img" aria-label="Выбор файлов для .gitignore в дереве проекта">
  <defs>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0037da"/><stop offset="0.5" stop-color="#3b78ff"/><stop offset="1" stop-color="#61d6ff"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0037da" flood-opacity="0.35"/>
    </filter>
    <style>
      text { white-space: pre; font-family: 'Cascadia Code','JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace; font-size: 15px; }
      .p { fill: #3b78ff } .dim { fill: #34529a } .faint { fill: #1f3270 } .ice { fill: #bedcff } .cy { fill: #61d6ff }
      .ok { fill: #50e6aa } .warn { fill: #ffd26e } .w { fill: #f0f6ff }
      .ui { font-family: 'Segoe UI',system-ui,sans-serif; font-size: 13px; }
    </style>
  </defs>
  <rect x="10" y="6" width="900" height="452" rx="12" fill="#000" stroke="#1f3270" filter="url(#shadow)"/>
  <path d="M10 18a12 12 0 0 1 12-12h876a12 12 0 0 1 12 12v24H10z" fill="#0a0f1e"/>
  <rect x="22" y="12" width="170" height="30" rx="7" fill="#000"/>
  <text x="38" y="32" class="ui ice">◆  GitHelper</text>

  <text x="30" y="76"><tspan class="cy" font-weight="700">◆ GitHelper</tspan><tspan class="dim">  ›  </tspan><tspan class="ice">.gitignore › выбор файлов</tspan></text>
  <rect x="30" y="90" width="860" height="2" fill="url(#hl)"/>
  <text x="30" y="122"><tspan class="ok">✔</tspan> <tspan class="ok">Определил стек: Rust, Node.js / JavaScript / TypeScript</tspan></text>
  <text x="30" y="150"><tspan class="cy">?</tspan> <tspan class="w">Отметь файлы и папки, которые НЕ должны попасть в репозиторий</tspan></text>

  <!-- выделение -->
  <rect x="30" y="226" width="860" height="24" fill="#0e225c">
    <animate attributeName="y" dur="7s" repeatCount="indefinite" values="178;178;202;202;226;226;298;298;178" keyTimes="0;.15;.2;.35;.4;.6;.65;.9;1" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/>
  </rect>

  <text x="44" y="195"><tspan class="cy">◉</tspan> <tspan class="dim">▸</tspan> <tspan class="ice">▣</tspan> <tspan class="dim">node_modules</tspan><tspan class="warn">  ★ рекомендую</tspan></text>
  <text x="44" y="219"><tspan class="cy">◉</tspan> <tspan class="dim">▸</tspan> <tspan class="ice">▣</tspan> <tspan class="dim">target</tspan><tspan class="warn">  ★ рекомендую</tspan></text>
  <text x="44" y="243"><tspan class="dim">○</tspan> <tspan class="dim">▾</tspan> <tspan class="ice">▣</tspan> <tspan class="ice">src</tspan></text>
  <text x="44" y="267">  <tspan class="dim">○</tspan>   <tspan class="dim">▫</tspan> <tspan class="p">main.rs</tspan><tspan class="faint">     12 КБ</tspan></text>
  <text x="44" y="291">  <tspan class="dim">○</tspan>   <tspan class="dim">▫</tspan> <tspan class="p">ui.rs</tspan><tspan class="faint">       38 КБ</tspan></text>
  <!-- .env: отметка включается анимацией -->
  <text x="44" y="315"><tspan class="dim">○</tspan>   <tspan class="dim">▫</tspan> <tspan class="p">.env</tspan><tspan class="faint">         1 КБ</tspan><tspan class="warn">  ★ рекомендую</tspan></text>
  <text x="44" y="315" class="cy" opacity="0">◉<animate attributeName="opacity" dur="7s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.72;.73;.98;1"/></text>
  <text x="44" y="339"><tspan class="dim">○</tspan>   <tspan class="dim">▫</tspan> <tspan class="p">Cargo.toml</tspan><tspan class="faint">   1 КБ</tspan></text>
  <text x="44" y="363"><tspan class="dim">○</tspan>   <tspan class="dim">▫</tspan> <tspan class="p">README.md</tspan><tspan class="faint">    4 КБ</tspan></text>
  <text x="44" y="387"><tspan class="cy">◉</tspan>   <tspan class="dim">▫</tspan> <tspan class="dim">debug.log</tspan><tspan class="faint">  220 КБ</tspan><tspan class="warn">  ★ рекомендую</tspan></text>

  <text x="30" y="420"><tspan class="dim">отмечено: </tspan><tspan class="cy">3</tspan></text>
  <text x="30" y="444" class="faint"><tspan class="dim">Пробел</tspan> отметить  <tspan class="dim">→/←</tspan> раскрыть/свернуть  <tspan class="dim">R</tspan> рекомендации  <tspan class="dim">Enter</tspan> готово  <tspan class="dim">Esc</tspan> отмена</text>
</svg>
