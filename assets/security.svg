<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-label="Проверка коммита на секреты и большие файлы">
  <defs>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0037da"/><stop offset="0.5" stop-color="#3b78ff"/><stop offset="1" stop-color="#61d6ff"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0037da" flood-opacity="0.35"/>
    </filter>
    <style>
      text { white-space: pre; font-family: 'Cascadia Code','JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace; font-size: 15px; }
      .p { fill: #3b78ff } .dim { fill: #34529a } .faint { fill: #1f3270 } .ice { fill: #bedcff } .cy { fill: #61d6ff }
      .ok { fill: #50e6aa } .warn { fill: #ffd26e } .err { fill: #ff5f6e } .w { fill: #f0f6ff }
      .ui { font-family: 'Segoe UI',system-ui,sans-serif; font-size: 13px; }
    </style>
  </defs>
  <rect x="10" y="6" width="900" height="402" rx="12" fill="#000" stroke="#1f3270" filter="url(#shadow)"/>
  <path d="M10 18a12 12 0 0 1 12-12h876a12 12 0 0 1 12 12v24H10z" fill="#0a0f1e"/>
  <rect x="22" y="12" width="170" height="30" rx="7" fill="#000"/>
  <text x="38" y="32" class="ui ice">◆  GitHelper</text>

  <text x="30" y="76"><tspan class="cy" font-weight="700">◆ GitHelper</tspan><tspan class="dim">  ›  </tspan><tspan class="ice">Коммит › безопасность</tspan></text>
  <rect x="30" y="90" width="860" height="2" fill="url(#hl)"/>

  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.167;1" dur="0.60s" fill="freeze"/><text x="30" y="124"><tspan class="warn">▲ Найдены возможные секреты (3):</tspan></text></g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.375;1" dur="0.80s" fill="freeze"/><text x="30" y="150">    <tspan class="err">●</tspan> <tspan class="w">.env</tspan>                  <tspan class="warn">Файл с секретами/ключами</tspan></text></g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5;1" dur="1.00s" fill="freeze"/><text x="30" y="174">    <tspan class="err">●</tspan> <tspan class="w">src/bot.py</tspan><tspan class="dim">:14</tspan>         <tspan class="warn">Telegram бот-токен</tspan></text></g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.583;1" dur="1.20s" fill="freeze"/><text x="30" y="198">    <tspan class="err">●</tspan> <tspan class="w">config/deploy.js</tspan><tspan class="dim">:3</tspan>    <tspan class="warn">GitHub токен</tspan></text></g>

  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.643;1" dur="1.40s" fill="freeze"/><text x="30" y="234"><tspan class="warn">▲ Большие файлы (GitHub не примет файлы больше 100 МБ):</tspan></text></g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.688;1" dur="1.60s" fill="freeze"/><text x="30" y="258">    <tspan class="err">●</tspan> <tspan class="w">assets/intro.mp4</tspan>      <tspan class="err">143.2 МБ</tspan></text></g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.722;1" dur="1.80s" fill="freeze"/><text x="30" y="290"><tspan class="err">✖ Файлы больше 100 МБ GitHub отклонит — исключаю их из коммита.</tspan></text></g>

  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.762;1" dur="2.10s" fill="freeze"/>
    <text x="30" y="326"><tspan class="cy">?</tspan> <tspan class="w">Что сделать?</tspan></text>
    <rect x="30" y="336" width="860" height="24" fill="#0e225c"/>
    <rect x="30" y="336" width="4" height="24" fill="#61d6ff"/>
    <text x="44" y="353"><tspan class="w" font-weight="700">›  Исключить эти файлы и добавить в .gitignore (рекомендую)</tspan></text>
    <text x="44" y="379"><tspan class="dim">2</tspan>  <tspan class="p">›  Только исключить из этого коммита</tspan></text>
  </g>
</svg>
