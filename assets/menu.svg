<svg xmlns="http://www.w3.org/2000/svg" width="920" height="580" viewBox="0 0 920 580" role="img" aria-label="Главное меню GitHelper">
  <defs>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0037da"/>
      <stop offset="0.5" stop-color="#3b78ff"/>
      <stop offset="1" stop-color="#61d6ff"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#61d6ff"/>
      <stop offset="1" stop-color="#3b78ff"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0037da" flood-opacity="0.35"/>
    </filter>
    <style>
      text { white-space: pre; font-family: 'Cascadia Code','JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace; font-size: 15px; }
      .p { fill: #3b78ff } .dim { fill: #34529a } .faint { fill: #1f3270 } .ice { fill: #bedcff } .cy { fill: #61d6ff }
      .ok { fill: #50e6aa } .warn { fill: #ffd26e } .w { fill: #f0f6ff }
      .ui { font-family: 'Segoe UI',system-ui,sans-serif; font-size: 13px; }

    </style>
  </defs>

  <rect x="10" y="6" width="900" height="562" rx="12" fill="#000" stroke="#1f3270" filter="url(#shadow)"/>
  <!-- заголовок окна -->
  <path d="M10 18a12 12 0 0 1 12-12h876a12 12 0 0 1 12 12v24H10z" fill="#0a0f1e"/>
  <rect x="22" y="12" width="170" height="30" rx="7" fill="#000"/>
  <text x="38" y="32" class="ui ice">◆  GitHelper</text>
  <text x="836" y="31" class="ui dim">—</text>
  <text x="862" y="31" class="ui dim">□</text>
  <text x="886" y="31" class="ui dim">✕</text>

  <text x="30" y="76" font-weight="700" fill="url(#logo)">◆ GitHelper</text>
  <text x="30" y="100"><tspan class="dim">аккаунт </tspan><tspan class="ice">@octodev</tspan><tspan class="faint">  │  </tspan><tspan class="dim">проект </tspan><tspan class="ice">my-app</tspan><tspan class="faint">  │  </tspan><tspan class="dim">ветка </tspan><tspan class="ice">⎇ main</tspan><tspan class="faint">  │  </tspan><tspan class="dim">изменений </tspan><tspan class="warn">3</tspan><tspan class="faint">  │  </tspan><tspan class="dim">git </tspan><tspan class="ice">2.56.0</tspan></text>
  <rect x="30" y="112" width="860" height="2" fill="url(#hl)">
    <animate attributeName="width" values="0;860" dur="0.9s" fill="freeze"/>
  </rect>

  <!-- полоса выбора -->
  <g>
    <rect x="30" y="158" width="860" height="24" fill="#0e225c">
      <animate attributeName="y" dur="9s" repeatCount="indefinite" calcMode="spline"
        values="158;158;182;182;206;206;230;230;326;326;350;350;374;374;158"
        keyTimes="0;.1;.14;.24;.28;.38;.42;.52;.56;.66;.7;.8;.84;.94;1"
        keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/>
    </rect>
    <rect x="30" y="158" width="4" height="24" fill="#61d6ff">
      <animate attributeName="y" dur="9s" repeatCount="indefinite" calcMode="spline"
        values="158;158;182;182;206;206;230;230;326;326;350;350;374;374;158"
        keyTimes="0;.1;.14;.24;.28;.38;.42;.52;.56;.66;.7;.8;.84;.94;1"
        keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/>
    </rect>
  </g>

  <text x="40" y="146" class="dim">Главное <tspan class="faint">────────────────────────</tspan></text>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.091;1" dur="0.55s" fill="freeze"/><text x="44" y="175"><tspan class="dim">1</tspan>  <tspan class="p">➤  Опубликовать проект на GitHub</tspan><tspan x="470" class="faint">папка → .gitignore → коммит → push</tspan></text></g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.167;1" dur="0.60s" fill="freeze"/><text x="44" y="199"><tspan class="dim">2</tspan>  <tspan class="p">▣  Выбрать папку проекта</tspan><tspan x="470" class="faint">проводник, путь или недавние</tspan></text></g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.231;1" dur="0.65s" fill="freeze"/><text x="44" y="223"><tspan class="dim">3</tspan>  <tspan class="p">◉  Статус проекта</tspan><tspan x="470" class="faint">изменения, ветка, синхронизация, diff</tspan></text></g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.286;1" dur="0.70s" fill="freeze"/><text x="44" y="247"><tspan class="dim">4</tspan>  <tspan class="p">✍  Коммит</tspan><tspan x="470" class="faint">выбор файлов + проверка секретов</tspan></text></g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.333;1" dur="0.75s" fill="freeze"/><text x="44" y="271"><tspan class="dim">5</tspan>  <tspan class="p">⇅  Синхронизация</tspan><tspan x="470" class="faint">push / pull / fetch</tspan></text></g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.375;1" dur="0.80s" fill="freeze"/><text x="44" y="295"><tspan class="dim">6</tspan>  <tspan class="p">⊘  .gitignore</tspan><tspan x="470" class="faint">создать, дополнить, выбрать файлы</tspan></text></g>

  <text x="40" y="318" class="dim">Инструменты <tspan class="faint">────────────────────</tspan></text>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.412;1" dur="0.85s" fill="freeze"/><text x="44" y="343"><tspan class="dim">7</tspan>  <tspan class="p">⎇  Ветки</tspan><tspan x="470" class="faint">создать, переключить, слить, удалить</tspan></text></g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.444;1" dur="0.90s" fill="freeze"/><text x="44" y="367"><tspan class="dim">8</tspan>  <tspan class="p">☰  История коммитов</tspan><tspan x="470" class="faint">граф веток</tspan></text></g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.474;1" dur="0.95s" fill="freeze"/><text x="44" y="391"><tspan class="dim">9</tspan>  <tspan class="p">↶  Исправить ошибки</tspan><tspan x="470" class="faint">отмена коммита, откат, reflog</tspan></text></g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5;1" dur="1.00s" fill="freeze"/><text x="44" y="415"><tspan class="dim">a</tspan>  <tspan class="p">◫  Stash</tspan><tspan x="470" class="faint">временно отложить изменения</tspan></text></g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.524;1" dur="1.05s" fill="freeze"/><text x="44" y="439"><tspan class="dim">b</tspan>  <tspan class="p">★  Релиз / версия</tspan><tspan x="470" class="faint">тег + релиз с заметками</tspan></text></g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.545;1" dur="1.10s" fill="freeze"/><text x="44" y="463"><tspan class="dim">c</tspan>  <tspan class="p">⛨  Проверка безопасности</tspan><tspan x="470" class="faint">секреты, ключи, файлы &gt; 100 МБ</tspan></text></g>
  <g><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.565;1" dur="1.15s" fill="freeze"/><text x="44" y="487"><tspan class="dim">d</tspan>  <tspan class="p">▥  Статистика</tspan><tspan x="470" class="faint">языки, авторы, активность</tspan></text></g>

  <text x="30" y="530" class="faint"><tspan class="dim">↑↓</tspan> выбор   <tspan class="dim">Enter</tspan> открыть   <tspan class="dim">1-9 a-z</tspan> быстрый выбор   <tspan class="dim">Esc</tspan> назад</text>
</svg>
