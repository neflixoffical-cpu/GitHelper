<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="Мастер публикации: папка, .gitignore, коммит, GitHub, push">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060b18"/>
      <stop offset="1" stop-color="#0a1534"/>
    </linearGradient>
    <linearGradient id="prog" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0037da"/>
      <stop offset="0.5" stop-color="#3b78ff"/>
      <stop offset="1" stop-color="#61d6ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: 'Segoe UI','Inter',system-ui,sans-serif; }
      .m { font-family: 'Cascadia Code',Consolas,'DejaVu Sans Mono',monospace; }
    </style>
  </defs>
  <rect width="1000" height="250" rx="18" fill="url(#bg)" stroke="#1f3270"/>
  <text x="500" y="40" text-anchor="middle" font-size="15" fill="#5f7fc7" class="m" letter-spacing="3">МАСТЕР ПУБЛИКАЦИИ · ОДИН ЗАПУСК</text>

  <rect x="100" y="108" width="800" height="4" rx="2" fill="#1c2c56"/>
  <rect x="100" y="108" width="0" height="4" rx="2" fill="url(#prog)" filter="url(#glow)">
    <animate attributeName="width" dur="8s" repeatCount="indefinite" values="0;0;800;800;0" keyTimes="0;.05;.8;.95;1"/>
  </rect>

  <!-- узлы: x = 100, 300, 500, 700, 900; появление в моменты .05 .2375 .425 .6125 .8 -->
  <g filter="url(#glow)">
    <circle cx="100" cy="110" r="22" fill="#0b1020" stroke="#3b78ff" stroke-width="3">
      <animate attributeName="fill" dur="8s" repeatCount="indefinite" values="#0b1020;#3b78ff;#3b78ff;#0b1020" keyTimes="0;.05;.95;1"/>
    </circle>
    <circle cx="300" cy="110" r="22" fill="#0b1020" stroke="#3b78ff" stroke-width="3">
      <animate attributeName="fill" dur="8s" repeatCount="indefinite" values="#0b1020;#0b1020;#3b78ff;#3b78ff;#0b1020" keyTimes="0;.23;.24;.95;1"/>
    </circle>
    <circle cx="500" cy="110" r="22" fill="#0b1020" stroke="#3b78ff" stroke-width="3">
      <animate attributeName="fill" dur="8s" repeatCount="indefinite" values="#0b1020;#0b1020;#3b78ff;#3b78ff;#0b1020" keyTimes="0;.42;.43;.95;1"/>
    </circle>
    <circle cx="700" cy="110" r="22" fill="#0b1020" stroke="#3b78ff" stroke-width="3">
      <animate attributeName="fill" dur="8s" repeatCount="indefinite" values="#0b1020;#0b1020;#3b78ff;#3b78ff;#0b1020" keyTimes="0;.61;.62;.95;1"/>
    </circle>
    <circle cx="900" cy="110" r="22" fill="#0b1020" stroke="#50e6aa" stroke-width="3">
      <animate attributeName="fill" dur="8s" repeatCount="indefinite" values="#0b1020;#0b1020;#50e6aa;#50e6aa;#0b1020" keyTimes="0;.8;.81;.95;1"/>
    </circle>
  </g>
  <g font-size="20" text-anchor="middle" fill="#f0f6ff" class="m">
    <text x="100" y="117">▣</text>
    <text x="300" y="117">⊘</text>
    <text x="500" y="117">✍</text>
    <text x="700" y="117">◎</text>
    <text x="900" y="117">↑</text>
  </g>

  <g text-anchor="middle">
    <text x="100" y="166" font-size="17" font-weight="600" fill="#bedcff">Папка</text>
    <text x="100" y="190" font-size="13" fill="#5f7fc7">проводник или путь</text>
    <text x="100" y="208" font-size="13" fill="#5f7fc7">+ git init</text>

    <text x="300" y="166" font-size="17" font-weight="600" fill="#bedcff">.gitignore</text>
    <text x="300" y="190" font-size="13" fill="#5f7fc7">стек определяется сам</text>
    <text x="300" y="208" font-size="13" fill="#5f7fc7">+ выбор файлов в дереве</text>

    <text x="500" y="166" font-size="17" font-weight="600" fill="#bedcff">Коммит</text>
    <text x="500" y="190" font-size="13" fill="#5f7fc7">проверка на секреты</text>
    <text x="500" y="208" font-size="13" fill="#5f7fc7">и файлы &gt; 100 МБ</text>

    <text x="700" y="166" font-size="17" font-weight="600" fill="#bedcff">Репозиторий</text>
    <text x="700" y="190" font-size="13" fill="#5f7fc7">создаётся через API</text>
    <text x="700" y="208" font-size="13" fill="#5f7fc7">приватный / публичный</text>

    <text x="900" y="166" font-size="17" font-weight="600" fill="#50e6aa">Push ✔</text>
    <text x="900" y="190" font-size="13" fill="#5f7fc7">токен не пишется</text>
    <text x="900" y="208" font-size="13" fill="#5f7fc7">в .git/config</text>
  </g>
</svg>
