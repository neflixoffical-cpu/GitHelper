[package]
name = "githelper"
version = "1.0.0"
edition = "2021"
description = "GitHelper — красивый консольный помощник для Git и GitHub"
license = "MIT"
readme = "README.md"
keywords = ["git", "github", "cli", "tui", "gitignore"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
rfd = "0.15"
keyring = { version = "3", features = ["windows-native"] }
base64 = "0.22"
regex = "1"
dirs = "5"
open = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
